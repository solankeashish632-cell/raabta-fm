<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAABTA FM</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4efe6;
      color: #111;
      text-align: center;
      padding: 20px;
    }
    h1 { font-size: 2.5rem; margin-bottom: 5px; }
    p { color: #666; margin-bottom: 25px; }
    .buttons { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; flex-wrap: wrap; }
    button {
      padding: 10px 20px;
      border: 1px solid #333;
      border-radius: 20px;
      background: white;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background: #333; color: white; }
    iframe { border-radius: 12px; max-width: 100%; }
  </style>
</head>
<body>

  <h1>RAABTA FM</h1>
  <p>Pick a mood. Let the music find you.</p>

  <div class="buttons">
    <button onclick="play('37i9dQZF1DX3rxS2u213R8')">😊 Happy</button>
    <button onclick="play('37i9dQZF1DX7qK21R1Pq3Z')">🌧️ Sad</button>
    <button onclick="play('37i9dQZF1DX4WYAsP3v4Pq')">☕ Chill</button>
  </div>

  <iframe 
    id="player" 
    src="https://open.spotify.com/embed/playlist/37i9dQZF1DX3rxS2u213R8" 
    width="100%" 
    height="352" 
    frameborder="0" 
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>

  <script>
    function play(id) {
      document.getElementById('player').src = "https://open.spotify.com/embed/playlist/" + id;
    }
  </script>

</body>
</html>
